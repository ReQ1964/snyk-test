[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snyk"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    # Intentionally old dependencies for Snyk testing.
    "requests==2.19.1",
    "urllib3==1.24.1",
    "PyYAML==5.3.1",
    "Jinja2==2.10.1",
    "Flask==0.12.2",
]

[project.scripts]
calculator = "snyk_calculator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
